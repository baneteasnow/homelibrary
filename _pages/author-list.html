{%- include backtotop.html -%}

<br />

<style>
	.author-list-info {
		margin-bottom: 16px;
		font-size: 17px;
	}

	.author-list-info p {
		margin: 0 0 6px;
	}

	.author-name {
		font-size: 17px;
	}

	.author-highlight {
		background-color: #fff8cc;
		padding: 2px 6px;
		border-radius: 4px;
		font-weight: 600;
	}

	.author-count {
		display: inline-flex;
		align-items: center;
		gap: 7px;
		white-space: nowrap;
		font-size: 17px;
	}

	.author-count-dot {
		display: inline-block;
		width: 10px;
		height: 10px;
		flex: 0 0 10px;
		border-radius: 50%;
	}

	.count-1 {
		background-color: #cfcfcf;
	}

	.count-2-3 {
		background-color: #7da7d9;
	}

	.count-4-6 {
		background-color: #79a879;
	}

	.count-7-10 {
		background-color: #d9bf61;
	}

	.count-11-15 {
		background-color: #d99a5f;
	}

	.count-16-plus {
		background-color: #c96f6f;
	}

	#authorsTable {
		width: 100%;
		border-collapse: collapse;
	}

	#authorsTable th,
	#authorsTable td {
		font-size: 17px;
	}

	#authorsTable th:last-child,
	#authorsTable td:last-child {
		width: 90px;
	}
</style>

<div
	id="authorListInfo"
	class="author-list-info"
	style="display: none"
>
	<p>
		<strong><span id="authorTotal"></span> authors</strong>
	</p>

	<p>
		<a href="{{ '/frequent-authors/' | relative_url }}">
			authors with more than 5 books
		</a>
	</p>
</div>

<table
	id="authorsTable"
	class="zebra"
>
	<thead>
		<tr>
			<th style="text-align: left">author</th>
			<th style="text-align: left">books</th>
		</tr>
	</thead>

	<tbody></tbody>
</table>

{%- assign books_data = site.data.list.item | default: site.data.list -%}

<script
	id="booksData"
	type="application/json"
>
	{{ books_data | jsonify }}
</script>

<script>
	const booksDataElement = document.getElementById("booksData")
	const books = JSON.parse(booksDataElement.textContent)

	const tableBody = document.querySelector("#authorsTable tbody")
	const authorListInfo = document.getElementById("authorListInfo")
	const authorTotal = document.getElementById("authorTotal")

	function escapeHTML(value) {
		return String(value || "")
			.replaceAll("&", "&amp;")
			.replaceAll("<", "&lt;")
			.replaceAll(">", "&gt;")
			.replaceAll('"', "&quot;")
			.replaceAll("'", "&#039;")
	}

	function getAuthors(authorValue) {
		return String(authorValue || "")
			.split(",")
			.map((author) => author.trim())
			.filter(Boolean)
	}

	function getCountClass(count) {
		if (count === 1) {
			return "count-1"
		}

		if (count <= 3) {
			return "count-2-3"
		}

		if (count <= 6) {
			return "count-4-6"
		}

		if (count <= 10) {
			return "count-7-10"
		}

		if (count <= 15) {
			return "count-11-15"
		}

		return "count-16-plus"
	}

	const authorCounts = new Map()

	books.forEach((book) => {
		const authors = [...new Set(getAuthors(book.author))]

		authors.forEach((author) => {
			authorCounts.set(author, (authorCounts.get(author) || 0) + 1)
		})
	})

	const authors = Array.from(authorCounts, ([name, count]) => ({
		name,
		count,
	})).sort((a, b) => {
		if (b.count !== a.count) {
			return b.count - a.count
		}

		return a.name.localeCompare(b.name, "tr", {
			sensitivity: "base",
		})
	})

	authorTotal.textContent = authors.length
	authorListInfo.style.display = "block"

	tableBody.innerHTML = authors
		.map((author) => {
			const authorUrl =
				"{{ '/authors/' | relative_url }}?author=" +
				encodeURIComponent(author.name)

			const countClass = getCountClass(author.count)

			const highlightClass = author.count > 5 ? "author-highlight" : ""

			return `
				<tr>
					<td>
						<a
							href="${authorUrl}"
							class="author-name ${highlightClass}"
						>
							${escapeHTML(author.name)}
						</a>
					</td>

					<td>
						<span class="author-count">
							<span
								class="author-count-dot ${countClass}"
								aria-hidden="true"
							></span>

							<span>${author.count}</span>
						</span>
					</td>
				</tr>
			`
		})
		.join("")
</script>
