<div style="clear: both"></div>

<div id="readingProgress">
	<p>Loading reading progress…</p>
</div>
<div style="clear: both"></div>
<style>
	.reading-list {
		display: grid;
		gap: 42px;
	}

	.reading-item {
		padding-bottom: 24px;
		border-bottom: none;
	}

	.reading-number {
		font-size: 18px;
		margin-bottom: 26px;
	}

	.reading-title {
		font-size: 28px;

		font-weight: 600;
		font-style: italic;
		margin-bottom: 10px;
	}

	.reading-author {
		font-size: 24px;
		font-style: italic;
		margin-bottom: 34px;
	}

	.reading-format,
	.reading-total,
	.reading-percent {
		font-size: 15px;
		font-style: italic;
		margin-bottom: 8px;
	}

	.progress-row {
		display: flex;
		align-items: center;
		gap: 10px;
		margin-top: 22px;
	}
	.progress-track {
		flex: 1;
		height: 34px;
		overflow: hidden;
		background: #e3e3e3;
		border-radius: 0;
	}

	.progress-fill {
		height: 100%;
		background: #ffffff;
		border: 3px solid #dddddd;
	}

	.reading-pages {
		font-size: 15px;
		font-style: italic;
		white-space: nowrap;
	}

	@media (max-width: 600px) {

	.reading-title {
		font-size: 22px;
	}
	.reading-author {
		font-size: 19px;
	}
	.progress-track {
		height: 26px;
	}
</style>

<script>
	const READING_API_URL =
		"https://script.google.com/macros/s/AKfycbxRj_BExnSMkeDc2Hlj_yN7ay7uXN0WP_CiGcCaTzWcMQKgpimkPW1KYLgDjJNiPzu4/exec?mode=json"

	async function loadReadingProgress() {
		const container = document.getElementById("readingProgress")

		try {
			const response = await fetch(READING_API_URL, {
				cache: "no-store",
			})

			if (!response.ok) {
				throw new Error(`HTTP ${response.status}`)
			}

			const result = await response.json()
			const books = result.books || []

			if (!books.length) {
				container.innerHTML = "<p>No books are currently being read.</p>"
				return
			}

			const list = document.createElement("div")
			list.className = "reading-list"

			books.forEach((book) => {
				const item = document.createElement("div")
				item.className = "reading-item"

				const safePercentage = Math.max(
					0,
					Math.min(100, Number(book.percentage) || 0),
				)

				item.innerHTML = `
          <div class="reading-number">
            ❉ ${book.number || ""}
          </div>

          <div class="reading-title">
            ${escapeHtml(book.title)}
            ${book.year ? `(${book.year})` : ""}
          </div>

          <div class="reading-author">
            by ${escapeHtml(book.author || "")}
          </div>

          <div class="reading-format">
            reading as a ${escapeHtml(book.format || "book")}
          </div>

          <div class="reading-total">
            ${book.totalPages} pages
          </div>

          <div class="reading-percent">
            ${safePercentage}%
          </div>

          <div class="progress-row">
            <div
              class="progress-track"
              role="progressbar"
              aria-label="${escapeHtml(book.title)} reading progress"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="${safePercentage}"
            >
              <div
                class="progress-fill"
                style="width: ${safePercentage}%"
              ></div>
            </div>

            <div class="reading-pages">
              ${book.currentPage}/${book.totalPages}
            </div>
          </div>
        `

				list.appendChild(item)
			})

			container.innerHTML = ""
			container.appendChild(list)
		} catch (error) {
			console.error(error)

			container.innerHTML = `
				<p class="reading-error">
					Reading progress could not be loaded.
				</p>
			`
		}
	}

	function escapeHtml(value) {
		const element = document.createElement("div")
		element.textContent = String(value ?? "")
		return element.innerHTML
	}

	loadReadingProgress()
</script>
