<div class="converter-controls">
	<input
		type="file"
		id="imageInput"
		accept=".heic,.heif,image/heic,image/heif"
	/>

	<select id="outputFormat">
		<option value="image/jpeg">JPG</option>
		<option value="image/png">PNG</option>
	</select>

	<button
		type="button"
		id="convertButton"
	>
		Convert
	</button>
</div>

<p id="status"></p>
<p id="fileInfo"></p>

<script src="https://cdn.jsdelivr.net/npm/heic-to@1.5.2/dist/iife/heic-to.js"></script>

<script>
	const imageInput = document.getElementById("imageInput")
	const outputFormat = document.getElementById("outputFormat")
	const convertButton = document.getElementById("convertButton")
	const status = document.getElementById("status")
	const fileInfo = document.getElementById("fileInfo")

	function getBaseName(fileName) {
		return String(fileName || "converted-image").replace(/\.[^.]+$/, "")
	}

	function downloadBlob(blob, fileName) {
		const downloadURL = URL.createObjectURL(blob)
		const link = document.createElement("a")

		link.href = downloadURL
		link.download = fileName

		document.body.appendChild(link)
		link.click()
		link.remove()

		setTimeout(() => {
			URL.revokeObjectURL(downloadURL)
		}, 1000)
	}

	imageInput.addEventListener("change", async function () {
		const file = imageInput.files[0]

		status.textContent = ""
		fileInfo.textContent = ""

		if (!file) {
			return
		}

		try {
			const isHEIC = await HeicTo.isHeic(file)

			fileInfo.textContent = isHEIC
				? "Detected format: HEIC/HEIF"
				: "This file is not a supported HEIC/HEIF image."
		} catch (error) {
			console.error(error)

			fileInfo.textContent = "The file format could not be detected."
		}
	})

	convertButton.addEventListener("click", async function () {
		const file = imageInput.files[0]

		if (!file) {
			status.textContent = "Please select a HEIC or HEIF file."
			return
		}

		convertButton.disabled = true
		status.textContent = "Checking file..."

		try {
			if (typeof HeicTo !== "function" || typeof HeicTo.isHeic !== "function") {
				throw new Error("The HEIC converter library could not be loaded.")
			}

			const isHEIC = await HeicTo.isHeic(file)

			if (!isHEIC) {
				status.textContent = "This file is not a supported HEIC or HEIF image."
				return
			}

			status.textContent = "Converting..."

			const selectedType = outputFormat.value
			const baseName = getBaseName(file.name)

			const convertedBlob = await HeicTo({
				blob: file,
				type: selectedType,
				quality: selectedType === "image/jpeg" ? 0.92 : 1,
			})

			const extension = selectedType === "image/png" ? "png" : "jpg"

			downloadBlob(convertedBlob, `${baseName}.${extension}`)

			status.textContent = "Conversion complete."
		} catch (error) {
			console.error(error)

			status.textContent = "The file could not be converted."
		} finally {
			convertButton.disabled = false
		}
	})
</script>
