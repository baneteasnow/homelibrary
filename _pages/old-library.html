<h1>Old Library</h1>

<input
	type="text"
	id="searchInput"
	placeholder="Search books..."
	style="width: 100%; padding: 10px; margin-bottom: 20px"
/>

<table
	id="libraryTable"
	border="1"
	cellpadding="6"
>
	<thead></thead>
	<tbody></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
	Papa.parse("/assets/data/old-library.csv", {
		download: true,
		header: true,
		skipEmptyLines: true,

		complete: function (results) {
			const data = results.data

			if (!data.length) {
				document.body.innerHTML += "<p>CSV could not be loaded.</p>"
				return
			}

			const headers = Object.keys(data[0])

			const thead = document.querySelector("#libraryTable thead")
			const tbody = document.querySelector("#libraryTable tbody")

			thead.innerHTML = `
      <tr>
        ${headers.map((h) => `<th>${h}</th>`).join("")}
      </tr>
    `

			tbody.innerHTML = data
				.map(
					(row) => `
      <tr>
        ${headers.map((h) => `<td>${row[h] || ""}</td>`).join("")}
      </tr>
    `,
				)
				.join("")

			document
				.getElementById("searchInput")
				.addEventListener("input", function () {
					const term = this.value.toLowerCase()

					document.querySelectorAll("#libraryTable tbody tr").forEach((row) => {
						row.style.display = row.innerText.toLowerCase().includes(term)
							? ""
							: "none"
					})
				})
		},
	})
</script>
