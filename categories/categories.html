layout: page-6
published: true
title: "categories"
---

{%- include backtotop.html -%}

<br />

<style>
	.category-list-info {
		margin-bottom: 16px;
		font-size: 17px;
	}

	.category-list-info p {
		margin: 0 0 6px;
	}

	.category-layout {
		display: grid;
		grid-template-columns: minmax(280px, 0.9fr) minmax(320px, 1.1fr);
		gap: 34px;
		align-items: start;
	}

	.category-name {
		font-size: 17px;
	}

	.category-count {
		display: inline-flex;
		align-items: center;
		gap: 7px;
		white-space: nowrap;
		font-size: 17px;
	}

	.category-count-dot {
		display: inline-block;
		width: 10px;
		height: 10px;
		flex: 0 0 10px;
		border-radius: 50%;
	}

	.count-level-1 {
		background-color: #cfcfcf;
	}

	.count-level-2 {
		background-color: #b8a9c9;
	}

	.count-level-3 {
		background-color: #7da7d9;
	}

	.count-level-4 {
		background-color: #79a879;
	}

	.count-level-5 {
		background-color: #d9bf61;
	}

	.count-level-6 {
		background-color: #d99a5f;
	}

	.count-level-7 {
		background-color: #c96f6f;
	}

	#categoriesTable {
		width: 100%;
		border-collapse: collapse;
	}

	#categoriesTable th,
	#categoriesTable td {
		font-size: 17px;
	}

	#categoriesTable th:last-child,
	#categoriesTable td:last-child {
		width: 90px;
	}

	#categoriesTable tbody tr {
		cursor: pointer;
	}

	#categoriesTable tbody tr.is-selected {
		background: #f2f2f2;
	}

	.category-detail {
		position: sticky;
		top: 24px;
		padding: 20px 22px;
		border: 1px solid #dedede;
		border-radius: 6px;
	}

	.category-detail-title {
		margin: 0 0 14px;
		font-size: 20px;
		font-weight: 600;
	}

	.category-detail-scope {
		margin: 0 0 18px;
		font-size: 16px;
		line-height: 1.6;
	}

	.category-detail-count {
		margin: 0 0 14px;
		font-size: 14px;
		font-style: italic;
	}

	.category-detail-link {
		font-size: 15px;
	}

	.na-category {
		margin-top: 16px;
		color: #b7b2b2;
		font-style: italic;
		font-size: 14px;
	}

	.na-category a {
		color: inherit;
	}

	@media (max-width: 760px) {
		.category-layout {
			display: block;
		}

		.category-detail {
			position: static;
			margin-top: 24px;
		}
	}
</style>

<div
	id="categoryListInfo"
	class="category-list-info"
	style="display: none"
>
	<p>
		<strong> <span id="categoryTotal"></span> categories </strong>
	</p>
</div>

<div class="category-layout">
	<div>
		<table
			id="categoriesTable"
			class="zebra"
		>
			<thead>
				<tr>
					<th style="text-align: left">category</th>
					<th style="text-align: left">books</th>
				</tr>
			</thead>

			<tbody></tbody>
		</table>

		<div
			id="naCategory"
			class="na-category"
			style="display: none"
		>
			<a href="{{ '/categories/na' | relative_url }}">n/a</a>
			(<span id="naCategoryCount"></span>)
		</div>
	</div>

	<aside
		id="categoryDetail"
		class="category-detail"
		style="display: none"
	>
		<h2
			id="categoryDetailTitle"
			class="category-detail-title"
		></h2>

		<p
			id="categoryDetailScope"
			class="category-detail-scope"
		></p>

		<p
			id="categoryDetailCount"
			class="category-detail-count"
		></p>

		<a
			id="categoryDetailLink"
			class="category-detail-link"
			href="#"
		>
			browse books →
		</a>
	</aside>
</div>

{%- assign books_data = site.data.list.item | default: site.data.list -%}

<script
	id="booksData"
	type="application/json"
>
	{{ books_data | jsonify }}
</script>

<script>
	const booksDataElement = document.getElementById("booksData")
	const books = JSON.parse(booksDataElement.textContent)

	const tableBody = document.querySelector("#categoriesTable tbody")

	const categoryListInfo = document.getElementById("categoryListInfo")

	const categoryTotal = document.getElementById("categoryTotal")

	const naCategory = document.getElementById("naCategory")

	const naCategoryCount = document.getElementById("naCategoryCount")

	const categoryDetailTitle = document.getElementById("categoryDetailTitle")

	const categoryDetailScope = document.getElementById("categoryDetailScope")

	const categoryDetailCount = document.getElementById("categoryDetailCount")

	const categoryDetailLink = document.getElementById("categoryDetailLink")

	const categoryDetail = document.getElementById("categoryDetail")

	const categoryDetails = {
		PsychologyMentalLife: {
			label: "Psychology & Mental Life",
			scope:
				"Psychology, psychiatry, psychotherapy, emotions, relationships, trauma, personality, behavior, consciousness, mental health.",
		},

		PhilosophyMeaning: {
			label: "Philosophy & Meaning",
			scope:
				"Philosophy, ethics, religion, spirituality, existential questions, meaning, values, worldviews.",
		},

		PersonalGrowthProductivity: {
			label: "Personal Growth & Productivity",
			scope:
				"Personal development, habits, motivation, self-discipline, goal-setting, time management, productivity, practical self-improvement.",
		},

		HealthNutrition: {
			label: "Health & Nutrition",
			scope:
				"Health, medicine, illness, nutrition, metabolism, exercise, fitness, sleep, longevity, physical well-being.",
		},

		WorkCareer: {
			label: "Work & Career",
			scope:
				"Careers, leadership, management, teams, workplace culture, organizations, human resources, professional development.",
		},

		BusinessEconomics: {
			label: "Business & Economics",
			scope:
				"Business, entrepreneurship, companies, economics, finance, investment, markets, business models.",
		},

		ConsumerMarketing: {
			label: "Consumer & Marketing",
			scope:
				"Marketing, advertising, branding, sales, consumer culture, consumer behavior, purchasing psychology.",
		},

		TechnologyTheDigitalWorld: {
			label: "Technology & The Digital World",
			scope:
				"Technology, the internet, artificial intelligence, computers, social media, digital culture, digital transformation.",
		},

		CreativityExpression: {
			label: "Creativity & Expression",
			scope:
				"Creativity, writing, art, design, photography, architecture, music, aesthetics, creative processes.",
		},

		SocietyCulture: {
			label: "Society & Culture",
			scope:
				"Sociology, anthropology, education, culture, media, gender, social structures, social change, contemporary society",
		},

		HistoryPoliticalThought: {
			label: "History & Political Thought",
			scope:
				"History, wars, civilizations, political systems, political ideologies, democracy, power, geopolitics.",
		},

		ScienceDiscovery: {
			label: "Science & Discovery",
			scope:
				"Physics, biology, evolution, neuroscience, mathematics, astronomy, scientific discovery, popular science and the history of science..",
		},

		EnvironmentSustainableLiving: {
			label: "Environment & Sustainable Living",
			scope:
				"Environment, climate change, sustainability, nature, ecology, environmental policy, sustainable systems.",
		},

		BiographyLifeStories: {
			label: "Biography & Life Stories",
			scope:
				"Biographies, autobiographies, memoirs, personal narratives, diaries, and accounts of individual lives.",
		},

		SimpleLivingEverydayComforts: {
			label: "Simple Living & Everyday Comforts",
			scope:
				"Everyday life, simple living, home, food, coffee, hobbies, personal style, routines, practical pleasures and everyday comforts.",
		},
	}

	function escapeHTML(value) {
		return String(value || "")
			.replaceAll("&", "&amp;")
			.replaceAll("<", "&lt;")
			.replaceAll(">", "&gt;")
			.replaceAll('"', "&quot;")
			.replaceAll("'", "&#039;")
	}

	const categoryCounts = new Map()

	let naCount = 0

	books.forEach((book) => {
		const category = String(book.categories || "").trim()

		if (!category) {
			return
		}

		if (category.toLowerCase() === "n/a") {
			naCount += 1
			return
		}

		categoryCounts.set(category, (categoryCounts.get(category) || 0) + 1)
	})

	const categories = Array.from(categoryCounts, ([name, count]) => ({
		name,
		count,
	})).sort((a, b) => {
		if (b.count !== a.count) {
			return b.count - a.count
		}

		return a.name.localeCompare(b.name, "tr", {
			sensitivity: "base",
		})
	})

	const maxCount = categories.length ? categories[0].count : 0

	function getCountClass(count) {
		if (!maxCount) {
			return "count-level-1"
		}

		const ratio = count / maxCount

		if (ratio <= 0.12) {
			return "count-level-1"
		}

		if (ratio <= 0.25) {
			return "count-level-2"
		}

		if (ratio <= 0.4) {
			return "count-level-3"
		}

		if (ratio <= 0.55) {
			return "count-level-4"
		}

		if (ratio <= 0.7) {
			return "count-level-5"
		}

		if (ratio <= 0.85) {
			return "count-level-6"
		}

		return "count-level-7"
	}

	function showCategory(categoryName) {
		const category = categories.find((item) => item.name === categoryName)

		if (!category) {
			return
		}

		const details = categoryDetails[category.name] || {
			label: category.name,
			scope: "",
		}

		categoryDetail.style.display = "block"

		categoryDetailTitle.textContent = details.label

		categoryDetailScope.textContent = details.scope

		categoryDetailCount.textContent =
			category.count === 1 ? "1 book" : `${category.count} books`

		categoryDetailLink.href =
			"{{ '/browse/' | relative_url }}?field=categories&value=" +
			encodeURIComponent(category.name)

		document.querySelectorAll("#categoriesTable tbody tr").forEach((row) => {
			row.classList.toggle(
				"is-selected",
				row.dataset.category === category.name,
			)
		})
	}

	categoryTotal.textContent = categories.length
	categoryListInfo.style.display = "block"

	tableBody.innerHTML = categories
		.map((category) => {
			const countClass = getCountClass(category.count)

			const details = categoryDetails[category.name] || {
				label: category.name,
			}

			return `
				<tr data-category="${escapeHTML(category.name)}">
					<td>
						<span class="category-name">
							${escapeHTML(details.label)}
						</span>
					</td>

					<td>
						<span class="category-count">
							<span
								class="category-count-dot ${countClass}"
								aria-hidden="true"
							></span>

							<span>${category.count}</span>
						</span>
					</td>
				</tr>
			`
		})
		.join("")

	tableBody.addEventListener("click", (event) => {
		const row = event.target.closest("tr")

		if (!row) {
			return
		}

		showCategory(row.dataset.category)
	})

	if (naCount > 0) {
		naCategoryCount.textContent = naCount
		naCategory.style.display = "block"
	}
</script>
