---
layout: page-12
published: true
title: "categories"
permalink: /categories/
---

{%- include backtotop.html -%}

<br />

<style>
	.category-list {
		width: 100%;
		max-width: 520px;
	}
	.category-list-info {
		margin-bottom: 16px;
		font-size: 17px;
	}

	.category-list-info p {
		margin: 0 0 6px;
	}

	.category-layout {
		display: flex;
		justify-content: center;
		align-items: flex-start;
	}

	.category-name {
		font-size: 17px;
	}

	.category-count {
		display: inline-flex;
		align-items: center;
		gap: 7px;
		white-space: nowrap;
		font-size: 17px;
	}

	.category-count-dot {
		display: inline-block;
		width: 10px;
		height: 10px;
		flex: 0 0 10px;
		border-radius: 50%;
	}

	.count-level-1 {
		background-color: #cfcfcf;
	}

	.count-level-2 {
		background-color: #b8a9c9;
	}

	.count-level-3 {
		background-color: #7da7d9;
	}

	.count-level-4 {
		background-color: #79a879;
	}

	.count-level-5 {
		background-color: #d9bf61;
	}

	.count-level-6 {
		background-color: #d99a5f;
	}

	.count-level-7 {
		background-color: #c96f6f;
	}

	#categoriesTable {
		width: 100%;
		border-collapse: collapse;
	}

	#categoriesTable th,
	#categoriesTable td {
		font-size: 17px;
	}

	#categoriesTable th:last-child,
	#categoriesTable .category-row td:last-child {
		width: 90px;
	}

	#categoriesTable .category-row {
		cursor: pointer;
	}

	#categoriesTable tbody tr.is-selected {
		background: #f2f2f2;
	}

	.na-category {
		margin-top: 16px;
		color: #b7b2b2;
		font-style: italic;
		font-size: 14px;
	}

	.na-category a {
		color: inherit;
	}

	#categoriesTable .category-detail[hidden] {
		display: none;
	}

	#categoriesTable .category-detail td {
		width: auto;
		padding: 18px 14px;
		background: #fafafa;
		cursor: auto;
	}

	.category-detail-title {
		margin: 0 0 10px;
		font-size: 18px;
		font-weight: 600;
	}

	.category-detail-scope {
		margin: 0 0 14px;
		font-size: 16px;
		line-height: 1.6;
	}

	.category-detail-count {
		margin: 0 0 12px;
		font-size: 14px;
		font-style: italic;
	}

	.category-detail-link {
		font-size: 15px;
	}

	@media (max-width: 760px) {
		.category-layout {
			display: block;
		}

		.category-list {
			max-width: none;
		}
	}
	#selectedCategoryTable th.browse-cover, #selectedCategoryTable td.browse-cover {
		width: 48px !important;
		min-width: 48px !important;
		text-align: center;
		vertical-align: middle;
		padding: 3px !important;
	}
	#selectedCategoryTable .browse-cover img {
		display: block;
		width: auto;
		height: auto;
		max-width: 28px;
		max-height: 40px;
		margin: 0 auto;
		object-fit: contain;
	}
	@media (max-width: 768px) {
		.hl-table-scroll > #selectedCategoryTable {
			width: 1120px !important;
			min-width: 1120px !important;
		}
	}

</style>

<div
	id="categoryListInfo"
	class="category-list-info"
	style="display: none"
>
	<p>
		<strong> <span id="categoryTotal"></span> categories </strong>
	</p>
</div>

<div
	id="categoryLayout"
	class="category-layout"
>
	<div class="category-list">
		<table
			id="categoriesTable"
			class="zebra"
		>
			<thead>
				<tr>
					<th style="text-align: left">category</th>
					<th style="text-align: left">books</th>
				</tr>
			</thead>

			<tbody></tbody>
		</table>

		<div
			id="naCategory"
			class="na-category"
			style="display: none"
		>
			<a href="{{ '/categories/na' | relative_url }}">n/a</a>
			(<span id="naCategoryCount"></span>)
		</div>
	</div>
</div>

<section id="categoryBooksView" style="display:none">
  	<a href="{{ '/categories/' | relative_url }}"><h4 id="selectedCategoryTitle"></h4></a>
  <p id="selectedCategoryCount"></p>
  <link rel="stylesheet" href="{{ '/assets/css/table-scroll.css' | relative_url }}">
  <script src="{{ '/assets/js/table-scroll.js' | relative_url }}" defer></script>
  <div class="hl-table-scroll" data-hl-table-scroll>
    <table class="zebra" id="selectedCategoryTable" style="width:100%">
      <thead><tr><th>#</th><th class="book-title">name of the book</th><th>author</th><th>year</th><th>category</th><th class="book-read">read?</th><th>shelf</th><th>location</th><th class="browse-cover">cover</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="hl-scroll-indicator" aria-hidden="true"><span class="hl-scroll-thumb"></span></div>
  </div>
</section>

{%- assign books_data = site.data.list.item | default: site.data.list -%}

<script
	id="booksData"
	type="application/json"
>
	{{ books_data | jsonify }}
</script>

<script>
	let selectedRow = null
	const categoryLayout = document.getElementById("categoryLayout")

	const booksDataElement = document.getElementById("booksData")

	const books = JSON.parse(booksDataElement.textContent)

	const tableBody = document.querySelector("#categoriesTable tbody")

	const categoryListInfo = document.getElementById("categoryListInfo")

	const categoryTotal = document.getElementById("categoryTotal")

	const naCategory = document.getElementById("naCategory")

	const naCategoryCount = document.getElementById("naCategoryCount")


	const categoryDetails = {
		PsychologyMentalLife: {
			label: "PsychologyMentalLife",
			scope:
				"Psychology, psychiatry, psychotherapy, emotions, relationships, trauma, personality, behavior, consciousness, mental health.",
		},

		PhilosophyMeaning: {
			label: "PhilosophyMeaning",
			scope:
				"Philosophy, ethics, religion, spirituality, existential questions, meaning, values, worldviews.",
		},

		PersonalGrowthProductivity: {
			label: "PersonalGrowthProductivity",
			scope:
				"Personal development, habits, motivation, self-discipline, goal-setting, time management, productivity, practical self-improvement.",
		},

		HealthNutrition: {
			label: "HealthNutrition",
			scope:
				"Health, medicine, illness, nutrition, metabolism, exercise, fitness, sleep, longevity, physical well-being.",
		},

		WorkCareer: {
			label: "WorkCareer",
			scope:
				"Careers, leadership, management, teams, workplace culture, organizations, human resources, professional development.",
		},

		BusinessEconomics: {
			label: "BusinessEconomics",
			scope:
				"Business, entrepreneurship, companies, economics, finance, investment, markets, business models.",
		},

		ConsumerMarketing: {
			label: "ConsumerMarketing",
			scope:
				"Marketing, advertising, branding, sales, consumer culture, consumer behavior, purchasing psychology.",
		},

		TechnologyTheDigitalWorld: {
			label: "TechnologyTheDigitalWorld",
			scope:
				"Technology, the internet, artificial intelligence, computers, social media, digital culture, digital transformation.",
		},

		CreativityExpression: {
			label: "CreativityExpression",
			scope:
				"Creativity, writing, art, design, photography, architecture, music, aesthetics, creative processes.",
		},

		SocietyCulture: {
			label: "SocietyCulture",
			scope:
				"Sociology, anthropology, education, culture, media, gender, social structures, social change, contemporary society",
		},

		HistoryPoliticalThought: {
			label: "HistoryPoliticalThought",
			scope:
				"History, wars, civilizations, political systems, political ideologies, democracy, power, geopolitics.",
		},

		ScienceDiscovery: {
			label: "ScienceDiscovery",
			scope:
				"Physics, biology, evolution, neuroscience, mathematics, astronomy, scientific discovery, popular science and the history of science..",
		},

		EnvironmentSustainableLiving: {
			label: "EnvironmentSustainableLiving",
			scope:
				"Environment, climate change, sustainability, nature, ecology, environmental policy, sustainable systems.",
		},

		BiographyLifeStories: {
			label: "BiographyLifeStories",
			scope:
				"Biographies, autobiographies, memoirs, personal narratives, diaries, and accounts of individual lives.",
		},

		SimpleLivingEverydayComforts: {
			label: "SimpleLivingEverydayComforts",
			scope:
				"Everyday life, simple living, home, food, coffee, hobbies, personal style, routines, practical pleasures and everyday comforts.",
		},
	}

	function coverURL(book) {
		const raw = String(book.image ?? "").trim()
		if (!raw) return ""
		try {
			const url = new URL(raw, "https://www.next52books.com/")
			if (url.protocol !== "https:" && url.protocol !== "http:") return ""
			if (!/^(www\.)?next52books\.com$/i.test(url.hostname)) return ""
			if (!/\.(jpe?g|png|webp|gif|avif)$/i.test(url.pathname)) return ""
			if (/\/shelves\//i.test(url.pathname)) return ""
			return url.href
		} catch { return "" }
	}
	function renderCover(book) {
		const cover = coverURL(book)
		return cover ? `<a href="${escapeHTML(cover)}" target="_blank" rel="noopener noreferrer"><img src="${escapeHTML(cover)}" alt="${escapeHTML(book.title)} cover" loading="lazy" decoding="async" onerror="this.parentElement.remove()"></a>` : ""
	}

	function escapeHTML(value) {
		return String(value || "")
			.replaceAll("&", "&amp;")
			.replaceAll("<", "&lt;")
			.replaceAll(">", "&gt;")
			.replaceAll('"', "&quot;")
			.replaceAll("'", "&#039;")
	}

	const categoryCounts = new Map()

	let naCount = 0

	books.forEach((book) => {
		const category = String(book.categories || "").trim()

		if (!category) {
			return
		}

		if (category.toLowerCase() === "n/a") {
			naCount += 1
			return
		}

		categoryCounts.set(category, (categoryCounts.get(category) || 0) + 1)
	})

	const categories = Array.from(categoryCounts, ([name, count]) => ({
		name,
		count,
	})).sort((a, b) => {
		if (b.count !== a.count) {
			return b.count - a.count
		}

		return a.name.localeCompare(b.name, "tr", {
			sensitivity: "base",
		})
	})

	const maxCount = categories.length ? categories[0].count : 0

	function getCountClass(count) {
		if (!maxCount) {
			return "count-level-1"
		}

		const ratio = count / maxCount

		if (ratio <= 0.12) {
			return "count-level-1"
		}

		if (ratio <= 0.25) {
			return "count-level-2"
		}

		if (ratio <= 0.4) {
			return "count-level-3"
		}

		if (ratio <= 0.55) {
			return "count-level-4"
		}

		if (ratio <= 0.7) {
			return "count-level-5"
		}

		if (ratio <= 0.85) {
			return "count-level-6"
		}

		return "count-level-7"
	}

	categoryTotal.textContent = categories.length
	categoryListInfo.style.display = "block"

	tableBody.innerHTML = categories
		.map((category) => {
			const countClass = getCountClass(category.count)

			const details = categoryDetails[category.name] || {
				label: category.name,
				scope: "",
			}

			const browseURL =
				"{{ '/categories/' | relative_url }}?category=" +
				encodeURIComponent(category.name)

			const bookLabel =
				category.count === 1 ? "1 book" : `${category.count} books`

			return `
			<tr class="category-row">
				<td>
					<span class="category-name">
						${escapeHTML(details.label)}
					</span>
				</td>

				<td>
					<span class="category-count">
						<span
							class="category-count-dot ${countClass}"
							aria-hidden="true"
						></span>

						<span>${category.count}</span>
					</span>
				</td>
			</tr>

			<tr
				class="category-detail"
				hidden
			>
				<td colspan="2">
					<h3 class="category-detail-title">
						${escapeHTML(details.label)}
					</h3>

					<p class="category-detail-scope">
						${escapeHTML(details.scope)}
					</p>

					<p class="category-detail-count">
						${bookLabel}
					</p>

					<a
						class="category-detail-link"
						href="${browseURL}"
					>
						browse books →
					</a>
				</td>
			</tr>
		`
		})
		.join("")

	tableBody.addEventListener("click", (event) => {
		const row = event.target.closest(".category-row")

		if (!row) {
			return
		}

		const wasSelected = row === selectedRow
		if (selectedRow) {
			selectedRow.classList.remove("is-selected")
			selectedRow.nextElementSibling.hidden = true
		}

		selectedRow = wasSelected ? null : row
		if (selectedRow) {
			selectedRow.classList.add("is-selected")
			selectedRow.nextElementSibling.hidden = false
		}
	})

	if (naCount > 0) {
		naCategoryCount.textContent = naCount
		naCategory.style.display = "block"
	}

  // Dedicated category URL: independent of Browse and its filters.
  const requestedCategory = new URLSearchParams(window.location.search).get("category")
  if (requestedCategory) {
    document.getElementById("categoryListInfo").style.display = "none"
    categoryLayout.style.display = "none"
    const view = document.getElementById("categoryBooksView")
    view.style.display = "block"
    const detail = categoryDetails[requestedCategory]
    document.getElementById("selectedCategoryTitle").textContent = detail ? detail.label : requestedCategory
    const matches = books.filter(book => String(book.categories || "").trim() === requestedCategory)
    document.getElementById("selectedCategoryCount").textContent = `${matches.length} ${matches.length === 1 ? "book" : "books"}`
    document.querySelector("#selectedCategoryTable tbody").innerHTML = matches.slice().reverse().map(book => {
      const authorLinks = String(book.author || "").split(",").map(name => name.trim()).filter(Boolean).map(name =>
        `<a href="{{ '/authors/' | relative_url }}?author=${encodeURIComponent(name)}">${escapeHTML(name)}</a>`
      ).join(", ")
      const bookURL = "{{ '/booklist' | relative_url }}#" + encodeURIComponent(book.bookshelf || "")
      return `<tr>
        <td>${escapeHTML(book.bookshelf)}</td>
        <td><a href="${bookURL}"><b>${escapeHTML(book.title)}</b></a></td>
        <td>${authorLinks}</td>
        <td>${escapeHTML(book.year)}</td>
        <td>${escapeHTML(book.categories)}</td>
        <td>${book.status && book.status !== "UnRead" ? "yes" : "no"}</td>
        <td>${escapeHTML(book.notes)}</td>
        <td>${escapeHTML(book.location)}</td>
        <td class="browse-cover">${renderCover(book)}</td>
      </tr>`
    }).join("")
  }
</script>
