<div class="compressor">
	<div class="controls">
		<input
			type="file"
			id="imageInput"
			accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"
		/>

		<input
			type="text"
			id="fileNameInput"
			placeholder="File name..."
		/>
	</div>

	<p id="status">Choose an image.</p>

	<div id="resultCard">
		<div class="result-row">
			<div class="result-label">Original</div>

			<div id="originalSize">-</div>
		</div>

		<div class="result-row">
			<div class="result-label">Compressed</div>

			<div id="compressedSize">-</div>
		</div>

		<div class="result-row">
			<div class="result-label">Saved</div>

			<div id="savedPercent">-</div>
		</div>

		<div class="result-row">
			<div class="result-label">Metadata</div>

			<div>✓ Removed</div>
		</div>

		<div class="result-row">
			<div class="result-label">Compression</div>

			<div id="compressionComment">-</div>
		</div>

		<a
			id="downloadButton"
			href="#"
			download
		>
			Download JPG
		</a>
	</div>

	<div id="previewContainer">
		<div class="preview-grid">
			<div class="preview-card">
				<h3>Original</h3>

				<img
					id="originalPreview"
					alt="Original"
				/>
			</div>

			<div class="preview-card">
				<h3>Compressed</h3>

				<img
					id="compressedPreview"
					alt="Compressed"
				/>
			</div>
		</div>
	</div>
</div>

<script>
	const imageInput = document.getElementById("imageInput")

	const fileNameInput = document.getElementById("fileNameInput")

	const status = document.getElementById("status")

	const resultCard = document.getElementById("resultCard")

	const previewContainer = document.getElementById("previewContainer")

	const originalPreview = document.getElementById("originalPreview")

	const compressedPreview = document.getElementById("compressedPreview")

	const originalSize = document.getElementById("originalSize")

	const compressedSize = document.getElementById("compressedSize")

	const savedPercent = document.getElementById("savedPercent")

	const compressionComment = document.getElementById("compressionComment")

	const downloadButton = document.getElementById("downloadButton")

	let currentDownloadURL = null

	function getBaseName(fileName) {
		return String(fileName || "image").replace(/\.[^.]+$/, "")
	}

	function formatBytes(bytes) {
		if (bytes < 1024) {
			return bytes + " B"
		}

		if (bytes < 1024 * 1024) {
			return (bytes / 1024).toFixed(1) + " KB"
		}

		return (bytes / 1024 / 1024).toFixed(2) + " MB"
	}

	function getComment(percent) {
		if (percent >= 70) {
			return "★★★★★ Excellent"
		}

		if (percent >= 50) {
			return "★★★★☆ Very good"
		}

		if (percent >= 30) {
			return "★★★☆☆ Good"
		}

		if (percent >= 15) {
			return "★★☆☆☆ Small reduction"
		}

		return "★☆☆☆☆ Already optimized"
	}

	function loadImage(file) {
		return new Promise((resolve, reject) => {
			const url = URL.createObjectURL(file)

			const img = new Image()

			img.onload = function () {
				URL.revokeObjectURL(url)

				resolve(img)
			}

			img.onerror = function () {
				URL.revokeObjectURL(url)

				reject()
			}

			img.src = url
		})
	}

	function canvasToBlob(canvas) {
		return new Promise((resolve) => {
			canvas.toBlob(
				resolve,

				"image/jpeg",

				0.82,
			)
		})
	}

	function createCompressedImage(img) {
		return new Promise(async (resolve, reject) => {
			try {
				const canvas = document.createElement("canvas")

				const ctx = canvas.getContext("2d")

				canvas.width = img.naturalWidth
				canvas.height = img.naturalHeight

				ctx.imageSmoothingEnabled = true
				ctx.imageSmoothingQuality = "high"

				ctx.drawImage(img, 0, 0, canvas.width, canvas.height)

				const blob = await canvasToBlob(canvas)

				resolve(blob)
			} catch (error) {
				reject(error)
			}
		})
	}

	function prepareDownload(blob, fileName) {
		if (currentDownloadURL) {
			URL.revokeObjectURL(currentDownloadURL)
		}

		currentDownloadURL = URL.createObjectURL(blob)

		downloadButton.href = currentDownloadURL

		downloadButton.download = fileName

		compressedPreview.src = currentDownloadURL
	}

	imageInput.addEventListener("change", async () => {
		const file = imageInput.files[0]

		resultCard.style.display = "none"

		previewContainer.style.display = "none"

		status.textContent = ""

		if (!file) {
			status.textContent = "Choose an image."

			return
		}

		if (!file.type.startsWith("image/")) {
			status.textContent = "Unsupported image."

			return
		}

		const baseName = getBaseName(file.name)

		if (!fileNameInput.value) {
			fileNameInput.value = baseName
		}

		try {
			status.textContent = "Compressing..."

			const img = await loadImage(file)

			originalPreview.src = URL.createObjectURL(file)

			const compressedBlob = await createCompressedImage(img)

			const originalBytes = file.size

			const compressedBytes = compressedBlob.size

			const saved = 100 - (compressedBytes / originalBytes) * 100

			originalSize.textContent = formatBytes(originalBytes)

			compressedSize.textContent = formatBytes(compressedBytes)

			savedPercent.textContent = saved.toFixed(1) + "%"

			compressionComment.textContent = getComment(saved)

			const downloadName =
				(fileNameInput.value.trim() || baseName) + "-optimized.jpg"

			prepareDownload(compressedBlob, downloadName)

			resultCard.style.display = "block"

			previewContainer.style.display = "block"

			status.textContent = "Compression complete."
		} catch (error) {
			console.error(error)

			status.textContent = "The image could not be compressed."
		}
	})

	fileNameInput.addEventListener("input", () => {
		if (!downloadButton.download) {
			return
		}

		const current = fileNameInput.value.trim()

		if (current) {
			downloadButton.download = current + "-optimized.jpg"
		}
	})

	window.addEventListener("beforeunload", () => {
		if (currentDownloadURL) {
			URL.revokeObjectURL(currentDownloadURL)
		}
	})
</script>
