<script src="{{ '/assets/js/table-scroll.js' | relative_url }}" defer></script>


{%- include backtotop.html -%}

<br />

<style>
	#authorTable th.browse-cover, #authorTable td.browse-cover {
		width: 48px !important;
		min-width: 48px !important;
		text-align: center;
		vertical-align: middle;
		padding: 3px !important;
	}
	#authorTable .browse-cover img {
		display: block;
		width: auto;
		height: auto;
		max-width: 28px;
		max-height: 40px;
		margin: 0 auto;
		object-fit: contain;
	}
	@media (max-width: 768px) {
		.hl-table-scroll > #authorTable {
			width: 1120px !important;
			min-width: 1120px !important;
		}
	}

</style>

<div id="authorPage">
	<p id="loadingMessage">Loading...</p>

	<a href="{{ '/author-list/' | relative_url }}"><h4 id="authorTitle" style="display: none"></h4></a>

	<p
		id="bookCount"
		style="display: none"
	></p>

	<div class="hl-table-scroll" data-hl-table-scroll>
<table
		id="authorTable"
		class="zebra"
		style="display: none; width: 100%"
	>
		<thead>
			<tr>
				<th style="text-align: left">#</th>
				<th style="text-align: left">name of the book</th>
				<th class="book-author" style="text-align: left">author</th>
				<th style="text-align: left">year</th>
				<th style="text-align: left">category</th>
				<th class="book-read" style="text-align: left">read?</th>
				<th style="text-align: left">shelf</th>
				<th style="text-align: left">location</th><th class="browse-cover">cover</th>
			</tr>
		</thead>

		<tbody></tbody>
	</table>
  <div class="hl-scroll-indicator" aria-hidden="true"><span class="hl-scroll-thumb"></span></div>
</div>

	<p
		id="noResults"
		style="display: none"
	>
		No books found for this author.
	</p>
</div>
{%- assign books_data = site.data.list.item | default: site.data.list -%}

<script
	id="booksData"
	type="application/json"
>
	{{ books_data | jsonify }}
</script>
<script>
	const booksDataElement = document.getElementById("booksData")
	const books = JSON.parse(booksDataElement.textContent)

	const params = new URLSearchParams(window.location.search)
	const selectedAuthor = (params.get("author") || "").trim()

	const loadingMessage = document.getElementById("loadingMessage")
	const authorTitle = document.getElementById("authorTitle")
	const bookCount = document.getElementById("bookCount")
	const authorTable = document.getElementById("authorTable")
	const tableBody = authorTable.querySelector("tbody")
	const noResults = document.getElementById("noResults")

	function coverURL(book) {
		const raw = String(book.image ?? "").trim()
		if (!raw) return ""
		try {
			const url = new URL(raw, "https://www.next52books.com/")
			if (url.protocol !== "https:" && url.protocol !== "http:") return ""
			if (!/^(www\.)?next52books\.com$/i.test(url.hostname)) return ""
			if (!/\.(jpe?g|png|webp|gif|avif)$/i.test(url.pathname)) return ""
			if (/\/shelves\//i.test(url.pathname)) return ""
			return url.href
		} catch { return "" }
	}
	function renderCover(book) {
		const cover = coverURL(book)
		return cover ? `<a href="${escapeHTML(cover)}" target="_blank" rel="noopener noreferrer"><img src="${escapeHTML(cover)}" alt="${escapeHTML(book.title)} cover" loading="lazy" decoding="async" onerror="this.parentElement.remove()"></a>` : ""
	}

	function escapeHTML(value) {
		return String(value || "")
			.replaceAll("&", "&amp;")
			.replaceAll("<", "&lt;")
			.replaceAll(">", "&gt;")
			.replaceAll('"', "&quot;")
			.replaceAll("'", "&#039;")
	}

	function normalize(value) {
		return String(value || "")
			.trim()
			.toLocaleLowerCase("en")
	}

	function getAuthors(authorValue) {
		return String(authorValue || "")
			.split(",")
			.map((author) => author.trim())
			.filter(Boolean)
	}

	function isRead(status) {
		return status && status !== "UnRead"
	}

	function getCategoryLabel(category) {
		const categories = {
			BiographyLifeStories: "BiographyfLifeStories",
			BusinessEconomics: "BusinessEconomics",
			ConsumerMarketing: "ConsumerMarketing",
			CreativityExpression: "CreativityExpression",
			EnvironmentSustainableLiving: "EnvironmentSustainableLiving",
			HealthNutrition: "HealthNutrition",
			HistoryPoliticalThought: "HistoryPoliticalThought",
			PersonalGrowthProductivity: "PersonalGrowthProductivity",
			PhilosophyMeaning: "PhilosophyMeaning",
			PsychologyMentalLife: "PsychologyMentalLife",
			SimpleLivingEverydayComforts: "SimpleLivingEverydayComforts",
			ScienceDiscovery: "ScienceDiscovery",
			SocietyCulture: "SocietyCulture",
			TechnologyTheDigitalWorld: "TechnologyTheDigitalWorld",
			WorkCareer: "WorkCareer",
		}

		return categories[category] || "category?"
	}

	loadingMessage.style.display = "none"

	if (!selectedAuthor) {
		window.location.replace("{{ '/author-list/' | relative_url }}")
	} else {
		const matchingBooks = books.filter((book) => {
			const authors = getAuthors(book.author)

			return authors.some(
				(author) => normalize(author) === normalize(selectedAuthor),
			)
		})

		authorTitle.textContent = selectedAuthor
		authorTitle.style.display = "block"

		if (!matchingBooks.length) {
			noResults.style.display = "block"
		} else {
			bookCount.textContent =
				matchingBooks.length === 1 ? "1 book" : `${matchingBooks.length} books`

			bookCount.style.display = "block"
			authorTable.style.display = "table"

			tableBody.innerHTML = matchingBooks
				.map((book) => {
					const bookUrl =
						"{{ '/booklist' | relative_url }}#" +
						encodeURIComponent(book.bookshelf || "")

					return `
						<tr>
							<td>${escapeHTML(book.bookshelf)}</td>

							<td>
								<a href="${bookUrl}">
									<b>${escapeHTML(book.title)}</b>
								</a>
							</td>

							<td>${escapeHTML(book.author)}</td>

							<td>${escapeHTML(book.year)}</td>

							<td>
								${escapeHTML(getCategoryLabel(book.categories))}
							</td>

							<td>
								${isRead(book.status) ? "yes" : "no"}
							</td>

							<td>${escapeHTML(book.notes)}</td>

							<td>${escapeHTML(book.location)}</td>
        <td class="browse-cover">${renderCover(book)}</td>
						</tr>
					`
				})
				.join("")
		}
	}
</script>
