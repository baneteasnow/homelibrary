<div style="clear: both"></div>

<div id="readingProgress">
	<p>Loading reading progress…</p>
</div>
<div style="clear: both"></div>
<style>
	.reading-list {
		display: grid;
		gap: 18px;
	}

	.reading-item {
		padding-bottom: 14px;
		border-bottom: 1px solid #e5e5e5;
	}

	.reading-title {
		font-weight: 600;
		font-style: italic;
		margin-bottom: 5px;
	}

	.reading-pages {
		font-size: 14px;
		margin-bottom: 8px;
	}

	.progress-track {
		width: 100%;
		height: 6px;
		overflow: hidden;
		border-radius: 999px;
		background: #eeeeee;
	}

	.progress-fill {
		height: 100%;
		background: #555555;
	}

	.progress-percent {
		margin-top: 5px;
		font-size: 12px;
		color: #666666;
	}

	.reading-error {
		font-size: 14px;
		color: #666666;
	}
</style>

<script>
	const READING_API_URL =
		"https://script.google.com/macros/s/AKfycbxRj_BExnSMkeDc2Hlj_yN7ay7uXN0WP_CiGcCaTzWcMQKgpimkPW1KYLgDjJNiPzu4/exec?mode=json"

	async function loadReadingProgress() {
		const container = document.getElementById("readingProgress")

		try {
			const response = await fetch(READING_API_URL, {
				cache: "no-store",
			})

			if (!response.ok) {
				throw new Error(`HTTP ${response.status}`)
			}

			const result = await response.json()
			const books = result.books || []

			if (!books.length) {
				container.innerHTML = "<p>No books are currently being read.</p>"
				return
			}

			const list = document.createElement("div")
			list.className = "reading-list"

			books.forEach((book) => {
				const item = document.createElement("div")
				item.className = "reading-item"

				const safePercentage = Math.max(
					0,
					Math.min(100, Number(book.percentage) || 0),
				)

				item.innerHTML = `
					<div class="reading-title">${escapeHtml(book.title)}</div>

					<div class="reading-pages">
						${book.currentPage} / ${book.totalPages}
					</div>

					<div
						class="progress-track"
						role="progressbar"
						aria-label="${escapeHtml(book.title)} reading progress"
						aria-valuemin="0"
						aria-valuemax="100"
						aria-valuenow="${safePercentage}"
					>
						<div
							class="progress-fill"
							style="width: ${safePercentage}%"
						></div>
					</div>

					<div class="progress-percent">
						${safePercentage}%
					</div>
				`

				list.appendChild(item)
			})

			container.innerHTML = ""
			container.appendChild(list)
		} catch (error) {
			console.error(error)

			container.innerHTML = `
				<p class="reading-error">
					Reading progress could not be loaded.
				</p>
			`
		}
	}

	function escapeHtml(value) {
		const element = document.createElement("div")
		element.textContent = String(value ?? "")
		return element.innerHTML
	}

	loadReadingProgress()
</script>
