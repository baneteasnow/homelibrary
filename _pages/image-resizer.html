<div class="resizer">
	<div class="resizer-controls">
		<input
			type="file"
			id="imageInput"
			accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"
		/>
	</div>

	<label for="fileNameInput">File name</label>

	<input
		type="text"
		id="fileNameInput"
		placeholder="Enter file name..."
		style="margin-top: 8px; width: 100%; padding: 8px; box-sizing: border-box"
	/>

	<p id="status">Choose an image.</p>

	<div
		id="resizeResults"
		class="resize-results"
	>
		<div class="resize-card">
			<h3>192 × 192</h3>

			<img
				id="preview192"
				class="resize-preview"
				alt="192 by 192 preview"
			/>

			<a
				id="download192"
				class="download-button"
				href="#"
				download
			>
				Download 192 × 192
			</a>
		</div>

		<div class="resize-card">
			<h3>524 × 524</h3>

			<img
				id="preview524"
				class="resize-preview"
				alt="524 by 524 preview"
			/>

			<a
				id="download524"
				class="download-button"
				href="#"
				download
			>
				Download 524 × 524
			</a>
		</div>
	</div>
</div>

<script>
	const imageInput = document.getElementById("imageInput")
	const status = document.getElementById("status")
	const resizeResults = document.getElementById("resizeResults")

	const preview192 = document.getElementById("preview192")
	const preview524 = document.getElementById("preview524")

	const download192 = document.getElementById("download192")
	const download524 = document.getElementById("download524")
	const fileNameInput = document.getElementById("fileNameInput")

	let objectURLs = []

	function clearObjectURLs() {
		objectURLs.forEach((url) => {
			URL.revokeObjectURL(url)
		})

		objectURLs = []
	}

	function getBaseName(fileName) {
		return String(fileName || "image").replace(/\.[^.]+$/, "")
	}

	function loadImage(file) {
		return new Promise((resolve, reject) => {
			const imageURL = URL.createObjectURL(file)
			const image = new Image()

			image.onload = function () {
				URL.revokeObjectURL(imageURL)
				resolve(image)
			}

			image.onerror = function () {
				URL.revokeObjectURL(imageURL)
				reject(new Error("The image could not be opened."))
			}

			image.src = imageURL
		})
	}

	function canvasToBlob(canvas) {
		return new Promise((resolve, reject) => {
			canvas.toBlob(
				(blob) => {
					if (!blob) {
						reject(new Error("The resized image could not be created."))
						return
					}

					resolve(blob)
				},
				"image/jpeg",
				0.92,
			)
		})
	}

	async function createSquareImage(image, size) {
		const canvas = document.createElement("canvas")
		const context = canvas.getContext("2d")

		canvas.width = size
		canvas.height = size

		const sourceSize = Math.min(image.naturalWidth, image.naturalHeight)

		const sourceX = (image.naturalWidth - sourceSize) / 2

		const sourceY = (image.naturalHeight - sourceSize) / 2

		context.imageSmoothingEnabled = true
		context.imageSmoothingQuality = "high"

		context.drawImage(
			image,
			sourceX,
			sourceY,
			sourceSize,
			sourceSize,
			0,
			0,
			size,
			size,
		)

		return canvasToBlob(canvas)
	}

	function prepareDownload(blob, previewElement, downloadElement, fileName) {
		const objectURL = URL.createObjectURL(blob)

		objectURLs.push(objectURL)

		previewElement.src = objectURL
		downloadElement.href = objectURL
		downloadElement.download = fileName
	}

	imageInput.addEventListener("change", async function () {
		const file = imageInput.files[0]

		clearObjectURLs()
		resizeResults.style.display = "none"

		preview192.removeAttribute("src")
		preview524.removeAttribute("src")

		download192.removeAttribute("href")
		download524.removeAttribute("href")

		if (!file) {
			status.textContent = "Choose an image."
			return
		}

		if (!file.type.startsWith("image/")) {
			status.textContent = "Please select a JPG, PNG or WebP image."
			return
		}

		status.textContent = "Preparing images..."

		try {
			const image = await loadImage(file)
			const baseName = fileNameInput.value.trim() || getBaseName(file.name)
			fileNameInput.value = baseName

			const [blob192, blob524] = await Promise.all([
				createSquareImage(image, 192),
				createSquareImage(image, 524),
			])

			prepareDownload(
				blob192,
				preview192,
				download192,
				`${baseName}-192x192.jpg`,
			)

			prepareDownload(
				blob524,
				preview524,
				download524,
				`${baseName}-524x524.jpg`,
			)

			resizeResults.style.display = "grid"

			status.textContent = "Both sizes are ready."
		} catch (error) {
			console.error(error)

			status.textContent = "The image could not be resized."
		}
	})

	window.addEventListener("beforeunload", clearObjectURLs)
</script>
