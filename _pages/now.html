<div style="clear: both"></div>

<div id="readingProgress">
	<p>Loading reading progress…</p>
</div>
<div style="clear: both"></div>
<style>
	.reading-covers {
		display: flex;
		align-items: flex-end;
		gap: 8px;
		flex-wrap: wrap;
		margin-bottom: 34px;
	}

	.reading-cover {
		width: auto;
		height: 120px;
		display: block;
		object-fit: contain;
	}

	.reading-list {
		display: grid;
		gap: 34px;
	}

	.reading-item {
		padding: 0;
		border: 0;
	}

	.reading-number {
		font-size: 14px;
		line-height: 1.3;
		margin-bottom: 14px;
	}

	.reading-title {
		font-size: 18px;
		font-weight: normal;
		line-height: 1.35;
		margin-bottom: 4px;
	}

	.reading-author {
		font-size: 16px;
		font-style: italic;
		line-height: 1.35;
		margin-bottom: 16px;
	}

	.reading-format,
	.reading-total,
	.reading-percent,
	.reading-pages {
		font-size: 13px;
		font-style: italic;
		line-height: 1.35;
		margin: 0 0 3px;
	}

	.reading-pages {
		margin-top: 8px;
		white-space: nowrap;
	}

	.reading-error {
		font-size: 14px;
		color: #666666;
	}

	@media (max-width: 600px) {
		.reading-covers {
			gap: 6px;
			margin-bottom: 28px;
		}

		.reading-cover {
			height: 100px;
		}

		.reading-list {
			gap: 30px;
		}

		.reading-title {
			font-size: 17px;
		}

		.reading-author {
			font-size: 15px;
		}
	}
</style>
<script>
	const READING_API_URL =
		"https://script.google.com/macros/s/AKfycbxRj_BExnSMkeDc2Hlj_yN7ay7uXN0WP_CiGcCaTzWcMQKgpimkPW1KYLgDjJNiPzu4/exec?mode=json"

	async function loadReadingProgress() {
		const container = document.getElementById("readingProgress")

		try {
			const response = await fetch(READING_API_URL, {
				cache: "no-store",
			})

			if (!response.ok) {
				throw new Error(`HTTP ${response.status}`)
			}

			const result = await response.json()
			const books = result.books || []

			if (!books.length) {
				container.innerHTML = "<p>No books are currently being read.</p>"
				return
			}
			const covers = document.createElement("div")
			covers.className = "reading-covers"

			books.forEach((book) => {
				if (!book.image) return

				const image = document.createElement("img")
				image.src = book.image
				image.alt = `${book.title} cover`
				image.className = "reading-cover"
				image.loading = "lazy"

				covers.appendChild(image)
			})
			const list = document.createElement("div")
			list.className = "reading-list"

			books.forEach((book) => {
				const item = document.createElement("div")
				item.className = "reading-item"

				const safePercentage = Math.max(
					0,
					Math.min(100, Number(book.percentage) || 0),
				)

				item.innerHTML = `
    <div class="reading-number">
      ❉ ${book.number || ""}
    </div>

    <div class="reading-title">
      ${escapeHtml(book.title)}
      ${book.year ? ` · ${book.year}` : ""}
    </div>

    <div class="reading-author">
      by ${escapeHtml(book.author || "")}
    </div>

    <div class="reading-format">
      reading as a ${escapeHtml(book.format || "book")}
    </div>

    <div class="reading-total">
      ${book.total_pages} pages
    </div>

    <div class="reading-percent">
      ${safePercentage}%
    </div>

    <div class="reading-pages">
      ${book.current_page} / ${book.total_pages}
    </div>
`

				list.appendChild(item)
			})

			container.innerHTML = ""

			if (covers.children.length) {
				container.appendChild(covers)
			}

			container.appendChild(list)
		} catch (error) {
			console.error(error)

			container.innerHTML = `
				<p class="reading-error">
					Reading progress could not be loaded.
				</p>
			`
		}
	}

	function escapeHtml(value) {
		const element = document.createElement("div")
		element.textContent = String(value ?? "")
		return element.innerHTML
	}

	loadReadingProgress()
</script>
