title: "HEIC to .png / HEIC to .jpg"
---

<input
	type="file"
	id="heicInput"
	accept=".heic,.heif,image/heic,image/heif"
/>

<select id="outputFormat">
	<option value="image/jpeg">JPG</option>
	<option value="image/png">PNG</option>
</select>

<button id="convertButton">Convert</button>

<p id="status"></p>

<script src="https://cdn.jsdelivr.net/npm/heic2any/dist/heic2any.min.js"></script>

<script>
	const input = document.getElementById("heicInput")
	const formatSelect = document.getElementById("outputFormat")
	const convertButton = document.getElementById("convertButton")
	const status = document.getElementById("status")

	convertButton.addEventListener("click", async () => {
		const file = input.files[0]
		const fileType = file.type.toLowerCase()
		const fileName = file.name.toLowerCase()

		const looksLikeHEIC =
			fileType === "image/heic" ||
			fileType === "image/heif" ||
			fileName.endsWith(".heic") ||
			fileName.endsWith(".heif")

		if (!looksLikeHEIC) {
			status.textContent =
				"This file is not a HEIC or HEIF image. It may already be JPG or PNG."
			return
		}

		if (!file) {
			status.textContent = "Please select a HEIC file."
			return
		}

		status.textContent = "Converting..."

		try {
			const outputType = formatSelect.value

			const convertedBlob = await heic2any({
				blob: file,
				toType: outputType,
				quality: 0.9,
			})

			const blob = Array.isArray(convertedBlob)
				? convertedBlob[0]
				: convertedBlob

			const extension = outputType === "image/png" ? "png" : "jpg"

			const originalName = file.name.replace(/\.[^.]+$/, "")
			const downloadName = `${originalName}.${extension}`

			const downloadURL = URL.createObjectURL(blob)

			const link = document.createElement("a")
			link.href = downloadURL
			link.download = downloadName
			link.click()

			URL.revokeObjectURL(downloadURL)

			status.textContent = "Conversion complete."
		} catch (error) {
			console.error(error)
			status.textContent = "The file could not be converted."
		}
	})
</script>
