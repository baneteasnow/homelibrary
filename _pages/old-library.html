<input
	type="text"
	id="searchInput"
	placeholder="Search books..."
	style="width: 100%; padding: 10px; margin-bottom: 12px"
/>

<select
	id="releasedFilter"
	style="width: 100%; padding: 10px; margin-bottom: 20px"
>
	<option value="">All books</option>
	<option value="yes">Released: yes</option>
	<option value="no">Released: no</option>
</select>

<table
	id="libraryTable"
	border="1"
	cellpadding="6"
	style="width: 100%; border-collapse: collapse"
>
	<thead></thead>
	<tbody></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
	Papa.parse("/assets/data/old-library.csv", {
		download: true,
		header: true,
		skipEmptyLines: true,

		complete: function (results) {
			const data = results.data

			if (!data.length) {
				document.body.innerHTML += "<p>CSV could not be loaded.</p>"
				return
			}

			const headers = Object.keys(data[0])

			const thead = document.querySelector("#libraryTable thead")
			const tbody = document.querySelector("#libraryTable tbody")

			thead.innerHTML = `
				<tr>
					${headers.map((h) => `<th>${h}</th>`).join("")}
				</tr>
			`

			tbody.innerHTML = data
				.map(
					(row) => `
						<tr>
							${headers
								.map((h) => {
									const value = row[h] || ""

									if (value.startsWith("http")) {
										if (h.toLowerCase().includes("image")) {
											return `<td><a href="${value}" target="_blank" rel="noopener noreferrer">image</a></td>`
										}

										return `<td><a href="${value}" target="_blank" rel="noopener noreferrer">search</a></td>`
									}

									return `<td>${value}</td>`
								})
								.join("")}
						</tr>
					`,
				)
				.join("")

			const searchInput = document.getElementById("searchInput")
			const releasedFilter = document.getElementById("releasedFilter")

			function filterTable() {
				const term = searchInput.value.toLowerCase()
				const releasedValue = releasedFilter.value.toLowerCase()

				const releasedIndex = headers.findIndex(
					(h) => h.toLowerCase().trim() === "released?",
				)

				document.querySelectorAll("#libraryTable tbody tr").forEach((row) => {
					const textMatch = row.innerText.toLowerCase().includes(term)

					const cells = row.querySelectorAll("td")

					const releasedCell =
						releasedIndex >= 0
							? cells[releasedIndex].innerText.toLowerCase().trim()
							: ""

					const releasedMatch = !releasedValue || releasedCell === releasedValue

					row.style.display = textMatch && releasedMatch ? "" : "none"
				})
			}

			searchInput.addEventListener("input", filterTable)
			releasedFilter.addEventListener("change", filterTable)
		},
	})
</script>
