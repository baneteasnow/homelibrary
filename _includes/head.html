<head>
	<meta charset="utf-8" />
	<meta
		http-equiv="X-UA-Compatible"
		content="IE=edge"
	/>
	<meta
		name="viewport"
		content="width=device-width, initial-scale=1, viewport-fit=cover"
	/>

	<title>
		{%- if page.title -%} {{ page.title }} - homelibrary.next52books.com {%-
		else -%} {{ site.title }} {%- endif -%}
	</title>

	{%-seo title=false-%} {%-feed_meta-%}

	<link
		rel="shortcut icon"
		type="image/x-icon"
		href="{{ site.favicon | relative_url }}"
	/>
	<link
		rel="stylesheet"
		href="{{ '/assets/css/main.css' | relative_url }}"
	/>
	<link
		rel="apple-touch-icon"
		sizes="180x180"
		href="/assets/images/apple-touch-icon.png"
	/>
	<link
		rel="icon"
		type="image/png"
		sizes="32x32"
		href="/assets/images/favicon-32x32.png"
	/>
	<link
		rel="icon"
		type="image/png"
		sizes="16x16"
		href="/assets/images/favicon-16x16.png"
	/>
	<link
		rel="preconnect"
		href="https://fonts.googleapis.com"
	/>
	<link
		rel="preconnect"
		href="https://fonts.gstatic.com"
		crossorigin
	/>
	<link
		href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap"
		rel="stylesheet"
	/>
	<link
		rel="stylesheet"
		href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta2/css/all.min.css"
		crossorigin="anonymous"
		referrerpolicy="no-referrer"
	/>
	<link
		rel="manifest"
		href="/site.webmanifest"
	/>
	<link
		rel="mask-icon"
		href="/safari-pinned-tab.svg"
		color="#C9F9DA"
	/>
	<meta
		name="apple-mobile-web-app-status-bar-style"
		content="black-translucent"
	/>
		<meta
		name="theme-color"
		content="#C9F9DA"
	/>
	<meta
		name="apple-mobile-web-app-capable"
		content="yes"
	/>
	

	<!-- Home Library PWA startup images: iPhone (unchanged) -->
	<link rel="apple-touch-startup-image" href="/splashscreens/iphone-13-pro-max.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
	<link rel="apple-touch-startup-image" href="/splashscreens/iphone-17-pro-max.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

	<!-- Home Library PWA startup images: iPad Pro -->
	<link rel="apple-touch-startup-image" href="/splashscreens/ipad-pro-9-7-portrait.png" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
	<link rel="apple-touch-startup-image" href="/splashscreens/ipad-pro-9-7-landscape.png" media="(device-width: 1024px) and (device-height: 768px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
	<link rel="apple-touch-startup-image" href="/splashscreens/ipad-pro-10-5-portrait.png" media="(device-width: 834px) and (device-height: 1112px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
	<link rel="apple-touch-startup-image" href="/splashscreens/ipad-pro-10-5-landscape.png" media="(device-width: 1112px) and (device-height: 834px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
	<link rel="apple-touch-startup-image" href="/splashscreens/ipad-pro-11-portrait.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
	<link rel="apple-touch-startup-image" href="/splashscreens/ipad-pro-11-landscape.png" media="(device-width: 1194px) and (device-height: 834px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
	<link rel="apple-touch-startup-image" href="/splashscreens/ipad-pro-11-new-portrait.png" media="(device-width: 834px) and (device-height: 1210px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
	<link rel="apple-touch-startup-image" href="/splashscreens/ipad-pro-11-new-landscape.png" media="(device-width: 1210px) and (device-height: 834px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
	<link rel="apple-touch-startup-image" href="/splashscreens/ipad-pro-12-9-portrait.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
	<link rel="apple-touch-startup-image" href="/splashscreens/ipad-pro-12-9-landscape.png" media="(device-width: 1366px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
	<link rel="apple-touch-startup-image" href="/splashscreens/ipad-pro-13-portrait.png" media="(device-width: 1032px) and (device-height: 1376px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
	<link rel="apple-touch-startup-image" href="/splashscreens/ipad-pro-13-landscape.png" media="(device-width: 1376px) and (device-height: 1032px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
<!-- Separate status-bar background in iOS/iPadOS standalone mode. -->
<script>
  if (window.navigator.standalone === true) {
    document.documentElement.classList.add('homelibrary-ios-pwa');
  }
</script>
</head>
