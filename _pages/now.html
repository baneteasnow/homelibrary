<div style="clear: both"></div>

<div id="readingProgress">
	<p>Loading reading progress…</p>
</div>
<div style="clear: both"></div>
<style>
	.reading-list {
		display: grid;
		gap: 42px;
	}

	.reading-item {
		padding-bottom: 0;
		border-bottom: none;
	}

	.reading-number {
		font-size: 15px;
		margin-bottom: 20px;
	}

	.reading-title {
		font-size: 19px;
		font-weight: 600;
		line-height: 1.35;
		margin-bottom: 8px;
	}

	.reading-author {
		font-size: 17px;
		font-style: italic;
		line-height: 1.4;
		margin-bottom: 24px;
	}

	.reading-format,
	.reading-total,
	.reading-percent,
	.reading-pages {
		font-size: 12px;
		font-style: italic;
		line-height: 1.45;
		margin-bottom: 5px;
	}

	.reading-pages {
		margin-top: 10px;
	}

	.reading-error {
		font-size: 12px;
		color: #666666;
	}

	@media (max-width: 600px) {
		.reading-list {
			gap: 36px;
		}

		.reading-title {
			font-size: 18px;
		}

		.reading-author {
			font-size: 16px;
		}
	}
</style>

<script>
	const READING_API_URL =
		"https://script.google.com/macros/s/AKfycbxRj_BExnSMkeDc2Hlj_yN7ay7uXN0WP_CiGcCaTzWcMQKgpimkPW1KYLgDjJNiPzu4/exec?mode=json"

	async function loadReadingProgress() {
		const container = document.getElementById("readingProgress")

		try {
			const response = await fetch(READING_API_URL, {
				cache: "no-store",
			})

			if (!response.ok) {
				throw new Error(`HTTP ${response.status}`)
			}

			const result = await response.json()
			const books = result.books || []

			if (!books.length) {
				container.innerHTML = "<p>No books are currently being read.</p>"
				return
			}

			const list = document.createElement("div")
			list.className = "reading-list"

			books.forEach((book) => {
				const item = document.createElement("div")
				item.className = "reading-item"

				const safePercentage = Math.max(
					0,
					Math.min(100, Number(book.percentage) || 0),
				)

				item.innerHTML = `
    <div class="reading-number">
      ❉ ${book.number || ""}
    </div>

    <div class="reading-title">
      ${escapeHtml(book.title)}
      ${book.year ? `(${book.year})` : ""}
    </div>

    <div class="reading-author">
      by ${escapeHtml(book.author || "")}
    </div>

    <div class="reading-format">
      reading as a ${escapeHtml(book.format || "book")}
    </div>

    <div class="reading-total">
      ${book.totalPages} pages
    </div>

    <div class="reading-percent">
      ${safePercentage}%
    </div>

    <div class="reading-pages">
      ${book.currentPage} / ${book.totalPages}
    </div>
`

				list.appendChild(item)
			})

			container.innerHTML = ""
			container.appendChild(list)
		} catch (error) {
			console.error(error)

			container.innerHTML = `
				<p class="reading-error">
					Reading progress could not be loaded.
				</p>
			`
		}
	}

	function escapeHtml(value) {
		const element = document.createElement("div")
		element.textContent = String(value ?? "")
		return element.innerHTML
	}

	loadReadingProgress()
</script>
