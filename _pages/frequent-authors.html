---
layout: page-6
published: true
title: "authors with more than 5 books"
permalink: /frequent-authors/
---

{%- include backtotop.html -%}

<br />

<style>
	.frequent-authors-info {
		margin-bottom: 16px;
		font-size: 17px;
	}

	.frequent-authors-info p {
		margin: 0 0 6px;
	}

	.author-name {
		background-color: #fff8cc;
		padding: 2px 6px;
		border-radius: 4px;
		font-size: 17px;
		font-weight: 600;
	}

	.author-count {
		display: inline-flex;
		align-items: center;
		gap: 7px;
		white-space: nowrap;
		font-size: 17px;
	}

	.author-count-dot {
		display: inline-block;
		width: 10px;
		height: 10px;
		flex: 0 0 10px;
		border-radius: 50%;
	}

	.count-4-6 {
		background-color: #79a879;
	}

	.count-7-10 {
		background-color: #d9bf61;
	}

	.count-11-15 {
		background-color: #d99a5f;
	}

	.count-16-plus {
		background-color: #c96f6f;
	}

	#frequentAuthorsTable {
		width: 100%;
		border-collapse: collapse;
	}

	#frequentAuthorsTable th,
	#frequentAuthorsTable td {
		font-size: 17px;
	}

	#frequentAuthorsTable th:last-child,
	#frequentAuthorsTable td:last-child {
		width: 90px;
	}
</style>

<div
	id="frequentAuthorsInfo"
	class="frequent-authors-info"
	style="display: none"
>
	<p>
		<strong>
			<span id="frequentAuthorTotal"></span>
			authors with more than 5 books
		</strong>
	</p>

	<p>
		<a href="{{ '/author-list/' | relative_url }}"> all authors </a>
	</p>
</div>

<table
	id="frequentAuthorsTable"
	class="zebra"
>
	<thead>
		<tr>
			<th style="text-align: left">author</th>
			<th style="text-align: left">books</th>
		</tr>
	</thead>

	<tbody></tbody>
</table>

{%- assign books_data = site.data.list.item | default: site.data.list -%}

<script
	id="booksData"
	type="application/json"
>
	{{ books_data | jsonify }}
</script>

<script>
	const booksDataElement = document.getElementById("booksData")
	const books = JSON.parse(booksDataElement.textContent)

	const tableBody = document.querySelector("#frequentAuthorsTable tbody")

	const frequentAuthorsInfo = document.getElementById("frequentAuthorsInfo")

	const frequentAuthorTotal = document.getElementById("frequentAuthorTotal")

	function escapeHTML(value) {
		return String(value || "")
			.replaceAll("&", "&amp;")
			.replaceAll("<", "&lt;")
			.replaceAll(">", "&gt;")
			.replaceAll('"', "&quot;")
			.replaceAll("'", "&#039;")
	}

	function getAuthors(authorValue) {
		return String(authorValue || "")
			.split(",")
			.map((author) => author.trim())
			.filter(Boolean)
	}

	function getCountClass(count) {
		if (count <= 6) {
			return "count-4-6"
		}

		if (count <= 10) {
			return "count-7-10"
		}

		if (count <= 15) {
			return "count-11-15"
		}

		return "count-16-plus"
	}

	const authorCounts = new Map()

	books.forEach((book) => {
		const authors = [...new Set(getAuthors(book.author))]

		authors.forEach((author) => {
			authorCounts.set(author, (authorCounts.get(author) || 0) + 1)
		})
	})

	const frequentAuthors = Array.from(authorCounts, ([name, count]) => ({
		name,
		count,
	}))
		.filter((author) => author.count > 5)
		.sort((a, b) => {
			if (b.count !== a.count) {
				return b.count - a.count
			}

			return a.name.localeCompare(b.name, "tr", {
				sensitivity: "base",
			})
		})

	frequentAuthorTotal.textContent = frequentAuthors.length
	frequentAuthorsInfo.style.display = "block"

	tableBody.innerHTML = frequentAuthors
		.map((author) => {
			const authorUrl =
				"{{ '/authors/' | relative_url }}?author=" +
				encodeURIComponent(author.name)

			const countClass = getCountClass(author.count)

			return `
				<tr>
					<td>
						<a
							href="${authorUrl}"
							class="author-name"
						>
							${escapeHTML(author.name)}
						</a>
					</td>

					<td>
						<span class="author-count">
							<span
								class="author-count-dot ${countClass}"
								aria-hidden="true"
							></span>

							<span>${author.count}</span>
						</span>
					</td>
				</tr>
			`
		})
		.join("")
</script>
