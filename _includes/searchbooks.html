<style>
	#search-container {
		max-width: 95%;
		width: fit-content;
	}

	input[type="text"] {
		font-size: normal;
		outline: none;
		padding: 1rem;
		background: rgb(236, 237, 238);
		width: 100%;
		/* -webkit-appearance: none; */
		font-family: inherit;
		font-size: 100%;
		border: none;
	}
	#results-container {
		margin: 0.5rem 0;
	}
</style>

<!-- Html Elements for  Search -->
<div id="search-container">
	<input
		type="text"
		id="search-input"
		placeholder="Search for a book..."
		autocomplete="off"
	/>
	<ol id="results-container"></ol>
</div>

<!-- Script pointing to search-script.js -->
<script
	src="/search.js"
	type="text/javascript"
></script>

<!-- Configuration -->
<script>
	SimpleJekyllSearch({
		searchInput: document.getElementById("search-input"),
		resultsContainer: document.getElementById("results-container"),
		json: "/search.json",
		searchResultTemplate:
			'<div class="search-result" style="text-transform: lowercase">' +
			"<li>" +
			'<a href="{url}" title="{title}">' +
			"{title} | {author} | " +
			'<span style="text-transform: uppercase !important">{bookshelf}</span>' +
			'<span class="location"> • {location}</span>' +
			"</a>" +
			"</li>" +
			"</div>",
		noResultsText: "No results found",
		limit: 3000,
		fuzzy: false,
		exclude: ["Welcome"],
	})

	function cleanLocations() {
		const items = document.querySelectorAll("#results-container li.location")
		items.forEach((li) => {
			const text = li.textContent.trim()
			// Boşsa veya literal {location} ise tamamen kaldır
			if (!text || text === "{location}") {
				li.remove()
			}
		})
	}

	// Sonuçlar her değiştiğinde temizle
	const resultsContainer = document.getElementById("results-container")
	const observer = new MutationObserver(() => {
		cleanLocations()
	})
	observer.observe(resultsContainer, { childList: true, subtree: true })
</script>

<style>
	li.location:empty {
		display: none;
	}
</style>
<br />
<br />
<div style="clear: both"></div>
