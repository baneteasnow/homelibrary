<script>
	const imageInput = document.getElementById("imageInput")

	const fileNameInput = document.getElementById("fileNameInput")

	const qualitySelect = document.getElementById("qualitySelect")

	const compressorStatus = document.getElementById("compressorStatus")

	const resultCard = document.getElementById("resultCard")

	const originalSize = document.getElementById("originalSize")

	const optimizedSize = document.getElementById("optimizedSize")

	const savedPercent = document.getElementById("savedPercent")

	const compressionResult = document.getElementById("compressionResult")

	const downloadButton = document.getElementById("downloadButton")

	let selectedFile = null
	let loadedImage = null
	let currentDownloadURL = null
	let processingNumber = 0

	function getBaseName(fileName) {
		return String(fileName || "image").replace(/\.[^.]+$/, "")
	}

	function cleanFileName(fileName) {
		return (
			String(fileName || "image")
				.trim()
				.replace(/[\\/:*?"<>|]+/g, "-")
				.replace(/\s+/g, " ")
				.replace(/^\.+|\.+$/g, "") || "image"
		)
	}

	function formatBytes(bytes) {
		if (!Number.isFinite(bytes) || bytes < 0) {
			return "—"
		}

		if (bytes < 1024) {
			return `${bytes} B`
		}

		if (bytes < 1024 * 1024) {
			return `${(bytes / 1024).toFixed(1)} KB`
		}

		return `${(bytes / 1024 / 1024).toFixed(2)} MB`
	}

	function loadImage(file) {
		return new Promise((resolve, reject) => {
			const objectURL = URL.createObjectURL(file)

			const image = new Image()

			image.onload = function () {
				URL.revokeObjectURL(objectURL)
				resolve(image)
			}

			image.onerror = function () {
				URL.revokeObjectURL(objectURL)

				reject(new Error("The image could not be opened."))
			}

			image.src = objectURL
		})
	}

	function canvasToJPEGBlob(canvas, quality) {
		return new Promise((resolve, reject) => {
			canvas.toBlob(
				(blob) => {
					if (!blob) {
						reject(new Error("The optimized image could not be created."))

						return
					}

					resolve(blob)
				},
				"image/jpeg",
				quality,
			)
		})
	}

	async function createOptimizedJPEG(image, quality) {
		const canvas = document.createElement("canvas")

		const context = canvas.getContext("2d")

		if (!context) {
			throw new Error("Canvas is not supported.")
		}

		canvas.width = image.naturalWidth
		canvas.height = image.naturalHeight

		/*
			PNG veya WebP şeffafsa JPEG çıktısında
			siyah zemin oluşmaması için beyaz zemin.
		*/
		context.fillStyle = "#ffffff"
		context.fillRect(0, 0, canvas.width, canvas.height)

		context.imageSmoothingEnabled = true
		context.imageSmoothingQuality = "high"

		context.drawImage(image, 0, 0, canvas.width, canvas.height)

		/*
			Canvas yeniden kodlama yaptığı için EXIF,
			GPS, kamera ve benzeri metadata çıktıya
			aktarılmaz.
		*/
		return canvasToJPEGBlob(canvas, quality)
	}

	function getResultText(savedValue) {
		if (savedValue >= 70) {
			return "Excellent reduction"
		}

		if (savedValue >= 50) {
			return "Very good reduction"
		}

		if (savedValue >= 30) {
			return "Good reduction"
		}

		if (savedValue >= 10) {
			return "Small reduction"
		}

		if (savedValue > 0) {
			return "Minimal reduction"
		}

		return "Already optimized"
	}

	function revokeCurrentDownloadURL() {
		if (!currentDownloadURL) {
			return
		}

		URL.revokeObjectURL(currentDownloadURL)

		currentDownloadURL = null
	}

	function updateDownloadName() {
		if (!currentDownloadURL) {
			return
		}

		const typedName = cleanFileName(fileNameInput.value)

		downloadButton.download = `${typedName}-optimized.jpg`
	}

	async function processImage() {
		if (!selectedFile || !loadedImage) {
			return
		}

		const thisProcess = ++processingNumber

		compressorStatus.textContent = "Optimizing..."

		resultCard.style.display = "none"

		downloadButton.setAttribute("aria-disabled", "true")

		try {
			const quality = Number(qualitySelect.value)

			const optimizedBlob = await createOptimizedJPEG(loadedImage, quality)

			/*
				Kullanıcı bu sırada başka bir dosya
				seçtiyse eski işlemin sonucu gösterilmez.
			*/
			if (thisProcess !== processingNumber) {
				return
			}

			const originalBytes = selectedFile.size

			const optimizedBytes = optimizedBlob.size

			const rawSaved =
				originalBytes > 0 ? (1 - optimizedBytes / originalBytes) * 100 : 0

			const displayedSaved = Math.max(0, rawSaved)

			originalSize.textContent = formatBytes(originalBytes)

			optimizedSize.textContent = formatBytes(optimizedBytes)

			savedPercent.textContent = `${displayedSaved.toFixed(1)}%`

			compressionResult.textContent = getResultText(rawSaved)

			revokeCurrentDownloadURL()

			currentDownloadURL = URL.createObjectURL(optimizedBlob)

			downloadButton.href = currentDownloadURL

			downloadButton.setAttribute("aria-disabled", "false")

			updateDownloadName()

			resultCard.style.display = "block"

			if (rawSaved > 0) {
				compressorStatus.textContent = "Optimization complete."
			} else {
				compressorStatus.textContent =
					"The cleaned JPG is slightly larger than the original."
			}
		} catch (error) {
			console.error(error)

			compressorStatus.textContent = "The image could not be optimized."

			resultCard.style.display = "none"
		}
	}

	imageInput.addEventListener("change", async function () {
		const file = imageInput.files[0]

		processingNumber++

		selectedFile = null
		loadedImage = null

		revokeCurrentDownloadURL()

		resultCard.style.display = "none"

		fileNameInput.disabled = true
		qualitySelect.disabled = true

		downloadButton.href = "#"

		downloadButton.setAttribute("aria-disabled", "true")

		if (!file) {
			fileNameInput.value = ""

			compressorStatus.textContent = "Choose an image."

			return
		}

		const supportedTypes = ["image/jpeg", "image/png", "image/webp"]

		if (!supportedTypes.includes(file.type)) {
			fileNameInput.value = ""

			compressorStatus.textContent = "Please select a JPG, PNG or WebP image."

			return
		}

		fileNameInput.value = getBaseName(file.name)

		fileNameInput.disabled = false
		qualitySelect.disabled = false

		compressorStatus.textContent = "Opening image..."

		try {
			loadedImage = await loadImage(file)

			selectedFile = file

			await processImage()
		} catch (error) {
			console.error(error)

			compressorStatus.textContent = "The image could not be opened."
		}
	})

	qualitySelect.addEventListener("change", processImage)

	fileNameInput.addEventListener("input", updateDownloadName)

	window.addEventListener("beforeunload", revokeCurrentDownloadURL)
</script>
